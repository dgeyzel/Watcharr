name: Test (e2e)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    tags-ignore:
      - v*

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: "server/go.mod"

      - name: Get dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build UI
        run: npm run build

      - name: Build server, seed and TMDB stub
        run: sh scripts/e2e-build-go.sh

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
