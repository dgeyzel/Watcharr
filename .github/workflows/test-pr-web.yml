name: Test PR (web)

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-pr-web.yml"
      - "package*.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettier*"
      - "src/**"
  pull_request:
    branches:
      - "**"
    tags-ignore:
      - v*
    paths:
      - ".github/workflows/test-pr-web.yml"
      - "package*.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "eslint.config.js"
      - ".prettier*"
      - "src/**"

jobs:
  linter_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0

      - name: Setup Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: "npm"

      - name: Get dependencies
        run: npm ci

      - name: Check for linting/formatting errors
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit
